name: Discover Real API

on: workflow_dispatch

jobs:
  discover:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install requests
        run: pip install requests
      
      - name: Discover API endpoints
        run: |
          cat > discover.py << 'EOF'
          import requests
          import json
          import re
          
          print("Discovering SFWMD API endpoints...")
          print("=" * 60)
          
          # Structure to test
          structure = "S40"
          
          # List of potential API endpoints to try
          endpoints = [
              # The URL from your successful browser test
              ("direct_json", "https://sitedetailsreport.sfwmd.gov/realtime", 
               {"format": "json", "sites": structure, "status": "A"}),
               
              # Try without status parameter
              ("no_status", "https://sitedetailsreport.sfwmd.gov/realtime", 
               {"format": "json", "sites": structure}),
               
              # Try with different format
              ("xml_format", "https://sitedetailsreport.sfwmd.gov/realtime", 
               {"format": "xml", "sites": structure}),
               
              # Try different endpoint
              ("api_v1", "https://sitedetailsreport.sfwmd.gov/api/v1/realtime", 
               {"site": structure}),
               
              ("api_data", "https://sitedetailsreport.sfwmd.gov/api/data", 
               {"station": structure}),
               
              # Old DBHYDRO endpoints
              ("dbhydro_old", "https://www.sfwmd.gov/dbhydroplsql/web_io.report_process", 
               {"v_station": structure, "v_format": "json"}),
               
              ("dbhydro_data", "https://www.sfwmd.gov/dbhydroplsql/rest/time_series_data.get_data", 
               {"station_id": structure, "data_type": "FLOW"}),
               
              # Try with .json extension
              ("json_ext", f"https://sitedetailsreport.sfwmd.gov/realtime/{structure}.json", 
               {}),
               
              # Common water data APIs
              ("usgs", "https://waterservices.usgs.gov/nwis/iv", 
               {"format": "json", "sites": "02290800", "parameterCd": "00060"}),
          ]
          
          # Try different headers
          headers_list = [
              {"Accept": "application/json"},
              {"Accept": "application/json, text/plain, */*"},
              {"User-Agent": "Mozilla/5.0", "Accept": "application/json"},
              {},  # No headers
          ]
          
          successful_responses = []
          
          for endpoint_name, url, params in endpoints:
              print(f"\\nTrying endpoint: {endpoint_name}")
              print(f"URL: {url}")
              
              for i, headers in enumerate(headers_list):
                  print(f"  Headers set {i+1}: {headers}")
                  
                  try:
                      response = requests.get(url, params=params, headers=headers, timeout=15)
                      print(f"    Status: {response.status_code}")
                      print(f"    Content-Type: {response.headers.get('content-type', 'unknown')}")
                      
                      if response.status_code == 200:
                          # Check if it's JSON
                          content_type = response.headers.get('content-type', '').lower()
                          text = response.text.strip()
                          
                          is_json = False
                          if 'application/json' in content_type:
                              is_json = True
                          elif text.startswith('{') or text.startswith('['):
                              is_json = True
                          
                          if is_json:
                              try:
                                  data = json.loads(text)
                                  print(f"    ✓ FOUND JSON RESPONSE!")
                                  print(f"    JSON type: {type(data)}")
                                  
                                  # Save it
                                  filename = f"found_{endpoint_name}_headers{i}.json"
                                  with open(filename, "w") as f:
                                      json.dump(data, f, indent=2)
                                  
                                  # Check for useful data
                                  if isinstance(data, dict):
                                      print(f"    Keys: {list(data.keys())}")
                                      # Look for flow-related keys
                                      flow_keys = [k for k in data.keys() if 'flow' in k.lower() or 'discharge' in k.lower()]
                                      if flow_keys:
                                          print(f"    Found flow keys: {flow_keys}")
                                  
                                  successful_responses.append({
                                      "endpoint": endpoint_name,
                                      "url": response.url,
                                      "headers": headers,
                                      "filename": filename
                                  })
                                  
                              except json.JSONDecodeError:
                                  print(f"    ✗ Not valid JSON")
                                  # Save anyway for inspection
                                  filename = f"invalid_{endpoint_name}_headers{i}.txt"
                                  with open(filename, "w") as f:
                                      f.write(text[:1000])
                          else:
                              # Check if it's HTML
                              if '<!doctype html>' in text.lower() or '<html' in text.lower():
                                  print(f"    ✗ Returns HTML")
                              else:
                                  print(f"    ✗ Not JSON, length: {len(text)} chars")
                                  # Save for inspection
                                  filename = f"other_{endpoint_name}_headers{i}.txt"
                                  with open(filename, "w") as f:
                                      f.write(text[:1000])
                      else:
                          print(f"    ✗ HTTP {response.status_code}")
                          
                  except Exception as e:
                      print(f"    ✗ Error: {e}")
          
          # Summary
          print(f"\\n{'='*60}")
          print("DISCOVERY SUMMARY:")
          print('='*60)
          
          if successful_responses:
              print(f"Found {len(successful_responses)} JSON responses:")
              for resp in successful_responses:
                  print(f"  - {resp['endpoint']}: {resp['url']}")
                  print(f"    Saved as: {resp['filename']}")
          else:
              print("No JSON responses found. Trying one more approach...")
              
              # Try to fetch the main page and look for API URLs in JavaScript
              print("\\nFetching main page to look for API URLs...")
              main_url = "https://sitedetailsreport.sfwmd.gov/"
              try:
                  response = requests.get(main_url, timeout=10)
                  html = response.text
                  
                  # Look for API URLs in JavaScript
                  api_patterns = [
                      r'https?://[^"\']+\.json[^"\']*',
                      r'api[^"\']+',
                      r'realtime[^"\']+',
                      r'fetch\(["\']([^"\']+)["\']\)',
                      r'axios\.get\(["\']([^"\']+)["\']\)',
                  ]
                  
                  for pattern in api_patterns:
                      matches = re.findall(pattern, html, re.IGNORECASE)
                      if matches:
                          print(f"Found pattern '{pattern}':")
                          for match in matches[:5]:  # Show first 5
                              print(f"  - {match}")
                              
                  # Save HTML for manual inspection
                  with open("main_page.html", "w") as f:
                      f.write(html)
                  print("Saved main page to main_page.html")
                  
              except Exception as e:
                  print(f"Error fetching main page: {e}")
          
          print("\\nDiscovery complete!")
          EOF
          
          python discover.py
      
      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: api-discovery
          path: |
            found_*.json
            invalid_*.txt
            other_*.txt
            main_page.html
          retention-days: 7

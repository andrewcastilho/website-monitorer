name: Spillway Monitor

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:        # Manual trigger

env:
  # Headers for the API (from your cURL command)
  API_HEADERS: '{"accept": "application/json, text/plain, */*", "accept-language": "en-US,en;q=0.9", "origin": "https://sitedetailsreport.sfwmd.gov", "priority": "u=1, i", "referer": "https://sitedetailsreport.sfwmd.gov/", "sec-ch-ua": "\"Google Chrome\";v=\"143\", \"Chromium\";v=\"143\", \"Not A(Brand\";v=\"24\"", "sec-ch-ua-mobile": "?0", "sec-ch-ua-platform": "\"Windows\"", "sec-fetch-dest": "empty", "sec-fetch-mode": "cors", "sec-fetch-site": "same-site", "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0.0.0 Safari/537.36"}'

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Create directories
        run: mkdir -p data logs
      
      - name: Create monitor_fixed.py with corrected code
        run: |
          cat > monitor_fixed.py << 'EOF'
          #!/usr/bin/env python3
          """
          Spillway Gate Monitor - Fixed version without site_data error
          """
          
          import requests
          import json
          import os
          import logging
          from datetime import datetime
          from pathlib import Path
          
          # Configuration
          STRUCTURES = ["S44", "S41", "S155", "S40"]
          STATE_FILE = Path("data/last_values.json")
          LOG_FILE = Path("logs/monitor.log")
          
          SURGE_THRESHOLD = 500  # cfs jump that counts as a surge
          
          # REAL-TIME API endpoint from your browser network tab
          API_URL = "https://sitestatus.api.sfwmd.gov/v1/sitestatus/realtime"
          
          # Headers from your browser network tab
          HEADERS = {
              'accept': 'application/json, text/plain, */*',
              'accept-language': 'en-US,en;q=0.9',
              'origin': 'https://sitedetailsreport.sfwmd.gov',
              'priority': 'u=1, i',
              'referer': 'https://sitedetailsreport.sfwmd.gov/',
              'sec-ch-ua': '"Google Chrome";v="143", "Chromium";v="143", "Not A(Brand";v="24"',
              'sec-ch-ua-mobile': '?0',
              'sec-ch-ua-platform': '"Windows"',
              'sec-fetch-dest': 'empty',
              'sec-fetch-mode': 'cors',
              'sec-fetch-site': 'same-site',
              'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0.0.0 Safari/537.36',
          }
          
          # Setup logging
          def setup_logging():
              """Configure logging"""
              LOG_FILE.parent.mkdir(parents=True, exist_ok=True)
              
              logging.basicConfig(
                  level=logging.INFO,
                  format='%(asctime)s - %(name)s - %(levelname)s - %(message)s',
                  handlers=[
                      logging.FileHandler(LOG_FILE),
                      logging.StreamHandler()
                  ]
              )
              return logging.getLogger(__name__)
          
          logger = setup_logging()
          
          def load_state():
              """Load last known flow values"""
              try:
                  if STATE_FILE.exists():
                      with open(STATE_FILE, "r") as f:
                          return json.load(f)
                  return {}
              except Exception as e:
                  logger.error(f"Error loading state: {e}")
                  return {}
          
          def save_state(state):
              """Save current flow values"""
              try:
                  STATE_FILE.parent.mkdir(parents=True, exist_ok=True)
                  with open(STATE_FILE, "w") as f:
                      json.dump(state, f, indent=2)
              except Exception as e:
                  logger.error(f"Error saving state: {e}")
          
          def notify(structure, flow, delta=None):
              """Send Pushover notification"""
              try:
                  token = os.environ.get("PUSHOVER_TOKEN")
                  user = os.environ.get("PUSHOVER_USER")
                  
                  if not token or not user:
                      logger.error("Pushover credentials not set")
                      return False
                  
                  msg = f"🚨 {structure} FLOW ALERT\nFlow: {flow} cfs"
                  if delta:
                      msg += f"\nSurge: +{delta} cfs"
                  msg += f"\nTime: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}"
                  
                  response = requests.post(
                      "https://api.pushover.net/1/messages.json",
                      data={
                          "token": token,
                          "user": user,
                          "message": msg,
                          "title": "Spillway Alert",
                          "priority": 1
                      },
                      timeout=30
                  )
                  response.raise_for_status()
                  logger.info(f"Notification sent for {structure}")
                  return True
              except Exception as e:
                  logger.error(f"Error sending notification: {e}")
                  return False
          
          def get_flow(structure):
              """
              Get flow data from the REAL-TIME API endpoint
              Returns: flow value in cfs or None if error
              """
              try:
                  # Parameters from your curl command
                  params = {
                      "format": "json",
                      "sites": structure,
                      "status": "A"
                  }
                  
                  logger.debug(f"Fetching real-time data for {structure}")
                  
                  response = requests.get(
                      API_URL,
                      params=params,
                      headers=HEADERS,
                      timeout=30
                  )
                  
                  logger.debug(f"Status: {response.status_code}")
                  
                  if response.status_code != 200:
                      logger.error(f"API returned status {response.status_code} for {structure}")
                      return None
                  
                  try:
                      data = response.json()
                  except json.JSONDecodeError as e:
                      logger.error(f"Failed to parse JSON for {structure}: {e}")
                      return None
                  
                  # Save raw response for debugging
                  debug_file = Path(f"logs/{structure}_response.json")
                  debug_file.parent.mkdir(exist_ok=True)
                  with open(debug_file, "w") as f:
                      json.dump(data, f, indent=2)
                  
                  # Parse the response - based on your original JSON structure
                  if "timeSeriesResponse" in data and "timeSeries" in data["timeSeriesResponse"]:
                      time_series_list = data["timeSeriesResponse"]["timeSeries"]
                      
                      # Look for FLOW parameter
                      for time_series in time_series_list:
                          param = time_series.get("parameter", {})
                          param_name = param.get("parameterName", "")
                          unit_code = param.get("unit", {}).get("unitCode", "")
                          
                          # Check for FLOW parameter with cfs unit
                          if param_name == "FLOW" and unit_code == "cfs":
                              if "values" in time_series and len(time_series["values"]) > 0:
                                  latest_value = time_series["values"][0]
                                  if "value" in latest_value:
                                      flow_value = latest_value["value"]
                                      timestamp = latest_value.get("dateTime", "No timestamp")
                                      
                                      no_data_value = param.get("noDataValue", -99999.0)
                                      if flow_value != no_data_value:
                                          logger.info(f"Got flow for {structure}: {flow_value} cfs at {timestamp}")
                                          return float(flow_value)
                                      else:
                                          return 0.0
                  
                  logger.warning(f"No flow data found for {structure}")
                  return 0.0
                  
              except requests.exceptions.RequestException as e:
                  logger.error(f"HTTP error fetching data for {structure}: {e}")
                  return None
              except Exception as e:
                  logger.error(f"Unexpected error fetching flow for {structure}: {e}")
                  import traceback
                  logger.error(traceback.format_exc())
                  return None
          
          def check_structures():
              """Check all structures for flow changes"""
              state = load_state()
              changes_detected = False
              
              for structure in STRUCTURES:
                  try:
                      logger.info(f"Checking {structure}...")
                      
                      current = get_flow(structure)
                      
                      if current is None:
                          logger.warning(f"Could not retrieve flow for {structure}")
                          continue
                          
                      last = state.get(structure)
                      
                      if last is None:  # First reading
                          logger.info(f"{structure}: {current} cfs (first reading)")
                          
                          if current > 0:
                              logger.info(f"Gate already open on first check: {structure}")
                              # Uncomment the line below to get alert for already open gates
                              # notify(structure, current, None)
                      
                      else:  # Subsequent readings
                          logger.info(f"{structure}: {current} cfs (last: {last} cfs, delta: {current - last:.1f} cfs)")
                          
                          # Gate opens (transition from 0 to >0)
                          if current > 0 and last == 0:
                              logger.info(f"Gate opening detected for {structure}")
                              notify(structure, current)
                              changes_detected = True
                          
                          # Surge detection
                          elif current - last >= SURGE_THRESHOLD:
                              delta = current - last
                              logger.info(f"Surge detected for {structure}: +{delta} cfs")
                              notify(structure, current, delta)
                              changes_detected = True
                      
                      state[structure] = current
                      
                  except Exception as e:
                      logger.error(f"Error checking {structure}: {e}")
              
              if changes_detected:
                  save_state(state)
              else:
                  save_state(state)
              
              return changes_detected
          
          def main():
              """Main monitoring function"""
              logger.info("Starting spillway monitor with REAL-TIME API...")
              
              if not os.environ.get("PUSHOVER_TOKEN") or not os.environ.get("PUSHOVER_USER"):
                  logger.warning("Pushover credentials not found in environment")
                  logger.warning("Notifications will not be sent")
              
              # Test API connection first
              logger.info("Testing API connection...")
              test_response = requests.get(
                  API_URL,
                  params={"format": "json", "sites": "S155", "status": "A"},
                  headers=HEADERS,
                  timeout=10
              )
              
              if test_response.status_code == 200:
                  try:
                      test_data = test_response.json()
                      logger.info(f"API test successful. Response structure: {list(test_data.keys())}")
                      # Save test response
                      with open("logs/api_test_response.json", "w") as f:
                          json.dump(test_data, f, indent=2)
                  except:
                      logger.error(f"API test failed to parse JSON")
              else:
                  logger.error(f"API test failed with status: {test_response.status_code}")
              
              check_structures()
              logger.info("Check completed")
          
          if __name__ == "__main__":
              main()
          EOF
      
      - name: Run monitor
        run: python monitor_fixed.py
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      
      - name: Upload logs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-logs
          path: |
            logs/
            data/
          retention-days: 3
          if-no-files-found: ignore

name: Test API with Headers

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install requests
        run: pip install requests
      
      - name: Create and run test with headers
        run: |
          cat > test_api_headers.py << 'EOF'
import requests
import json

structures = ['S40', 'S44', 'S41', 'S155']

# Browser-like headers
headers = {
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
    'Accept': 'application/json, text/plain, */*',
    'Accept-Language': 'en-US,en;q=0.9',
    'Accept-Encoding': 'gzip, deflate, br',
    'Connection': 'keep-alive',
    'Sec-Fetch-Dest': 'empty',
    'Sec-Fetch-Mode': 'cors',
    'Sec-Fetch-Site': 'same-origin',
}

for structure in structures:
    print('\n' + '='*60)
    print(f'Testing {structure}')
    print('='*60)
    
    # Test 1: Try to get session first
    print('\n1. Getting initial session...')
    session_url = 'https://sitedetailsreport.sfwmd.gov/'
    try:
        session = requests.Session()
        response = session.get(session_url, headers=headers, timeout=10)
        print(f'Session status: {response.status_code}')
        print(f'Cookies: {session.cookies.get_dict()}')
    except Exception as e:
        print(f'Session error: {e}')
    
    # Test 2: Try realtime with session
    print('\n2. Trying realtime endpoint with session:')
    realtime_url = 'https://sitedetailsreport.sfwmd.gov/realtime'
    params = {'format': 'json', 'sites': structure, 'status': 'A'}
    
    try:
        response = session.get(realtime_url, params=params, headers=headers, timeout=10)
        print(f'Status: {response.status_code}')
        print(f'Content-Type: {response.headers.get("content-type")}')
        print(f'Response length: {len(response.text)} chars')
        
        if response.status_code == 200:
            # Try to parse as JSON
            try:
                data = response.json()
                print('✓ Successfully parsed as JSON!')
                print(f'JSON structure: {type(data)}')
                
                # Save the JSON
                filename = f'realtime_{structure}.json'
                with open(filename, 'w') as f:
                    json.dump(data, f, indent=2)
                print(f'Saved to {filename}')
                
                # Show structure
                if isinstance(data, list):
                    print(f'List length: {len(data)}')
                    if len(data) > 0:
                        print('First item keys:', list(data[0].keys()))
                else:
                    print('Object keys:', list(data.keys()))
                    
            except json.JSONDecodeError:
                print('✗ Response is not JSON')
                print(f'First 500 chars: {response.text[:500]}')
                
                # Save HTML for inspection
                filename = f'realtime_{structure}.html'
                with open(filename, 'w') as f:
                    f.write(response.text)
                print(f'Saved HTML to {filename}')
        else:
            print(f'Error response: {response.text[:200]}')
            
    except Exception as e:
        print(f'Realtime error: {e}')
    
    # Test 3: Try mdm endpoint
    print('\n3. Trying MDM endpoint:')
    mdm_url = 'https://sitedetailsreport.sfwmd.gov/mdm'
    params = {'site': structure}
    
    try:
        response = session.get(mdm_url, params=params, headers=headers, timeout=10)
        print(f'Status: {response.status_code}')
        print(f'Content-Type: {response.headers.get("content-type")}')
        
        if response.status_code == 200:
            try:
                data = response.json()
                print('✓ Successfully parsed as JSON!')
                
                filename = f'mdm_{structure}.json'
                with open(filename, 'w') as f:
                    json.dump(data, f, indent=2)
                print(f'Saved to {filename}')
                
            except json.JSONDecodeError:
                print('✗ Not JSON')
                print(f'Response: {response.text[:200]}')
        else:
            print(f'Error: {response.text[:200]}')
            
    except Exception as e:
        print(f'MDM error: {e}')
    
    print('\n' + '-'*60)
EOF
          
          python test_api_headers.py
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            realtime_*.json
            realtime_*.html
            mdm_*.json
          retention-days: 7

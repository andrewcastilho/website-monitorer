name: Debug Data Discrepancy

on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install requests
        run: pip install requests
      
      - name: Debug S155 data
        run: |
          cat > debug_s155.py << 'EOF'
          import requests
          import json
          from datetime import datetime
          
          print("Debugging S155 data discrepancy...")
          print("=" * 60)
          
          url = "https://sitestatus.api.sfwmd.gov/v1/sitestatus/realtime"
          params = {"format": "json", "sites": "S155", "status": "A"}
          
          headers = {
              'accept': 'application/json, text/plain, */*',
              'accept-language': 'en-US,en;q=0.9',
              'origin': 'https://sitedetailsreport.sfwmd.gov',
              'priority': 'u=1, i',
              'referer': 'https://sitedetailsreport.sfwmd.gov/',
              'sec-ch-ua': '"Google Chrome";v="143", "Chromium";v="143", "Not A(Brand";v="24"',
              'sec-ch-ua-mobile': '?0',
              'sec-ch-ua-platform': '"Windows"',
              'sec-fetch-dest': 'empty',
              'sec-fetch-mode': 'cors',
              'sec-fetch-site': 'same-site',
              'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0.0.0 Safari/537.36',
          }
          
          print(f"Time: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}")
          print(f"API URL: {url}")
          print(f"Params: {params}")
          print()
          
          try:
              response = requests.get(url, params=params, headers=headers, timeout=15)
              print(f"Status: {response.status_code}")
              
              if response.status_code == 200:
                  data = response.json()
                  
                  # Save full response
                  with open("s155_full_response.json", "w") as f:
                      json.dump(data, f, indent=2)
                  print("Full response saved to s155_full_response.json")
                  
                  # Extract ALL time series data
                  if "timeSeriesResponse" in data and "timeSeries" in data["timeSeriesResponse"]:
                      time_series_list = data["timeSeriesResponse"]["timeSeries"]
                      
                      print(f"\\nFound {len(time_series_list)} time series:")
                      print("-" * 60)
                      
                      for i, ts in enumerate(time_series_list):
                          print(f"\\nTime Series #{i+1}:")
                          print(f"  Name: {ts.get('name', 'N/A')}")
                          print(f"  Description: {ts.get('description', 'N/A')}")
                          
                          if "parameter" in ts:
                              param = ts["parameter"]
                              print(f"  Parameter: {param.get('parameterName', 'N/A')}")
                              print(f"  Description: {param.get('parameterDescription', 'N/A')}")
                              print(f"  Unit: {param.get('unit', {}).get('unitCode', 'N/A')}")
                          
                          if "values" in ts and len(ts["values"]) > 0:
                              latest = ts["values"][0]
                              print(f"  Latest value: {latest.get('value', 'N/A')}")
                              print(f"  Time: {latest.get('dateTime', 'N/A')}")
                              print(f"  Quality: {latest.get('qualityCode', 'N/A')}")
                          
                          print(f"  Current Status: {ts.get('currentStatus', 'N/A')}")
                          
                          # Check if this is the one we've been using
                          if ts.get("parameter", {}).get("parameterName") == "FLOW":
                              print(f"  ⭐ THIS IS THE FLOW DATA WE'VE BEEN USING")
                              
                  else:
                      print("No timeSeriesResponse found in data")
                      
                  # Also check for any other data structures
                  print(f"\\nOther keys in response: {list(data.keys())}")
                  
              else:
                  print(f"Error: {response.status_code}")
                  print(f"Response: {response.text[:200]}")
                  
          except Exception as e:
              print(f"Exception: {e}")
          
          print("\\n" + "=" * 60)
          print("Debug complete. Check s155_full_response.json for details.")
          EOF
          
          python debug_s155.py
      
      - name: Upload debug data
        uses: actions/upload-artifact@v4
        with:
          name: s155-debug
          path: |
            s155_full_response.json
          retention-days: 7

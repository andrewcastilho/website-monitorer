name: Debug API

on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install requests
        run: pip install requests
      
      - name: Debug API responses
        run: |
          cat > debug.py << 'EOF'
          import requests
          import json
          
          structures = ["S40", "S44", "S41", "S155"]
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Accept': 'application/json',
          }
          
          for structure in structures:
              print(f"\\n{'='*60}")
              print(f"Testing {structure}")
              print('='*60)
              
              url = "https://sitedetailsreport.sfwmd.gov/realtime"
              params = {"format": "json", "sites": structure, "status": "A"}
              
              print(f"URL: {url}")
              print(f"Params: {params}")
              
              try:
                  # Try with headers
                  print("\\n1. With headers:")
                  response = requests.get(url, params=params, headers=headers, timeout=10)
                  print(f"   Status: {response.status_code}")
                  print(f"   Content-Type: {response.headers.get('content-type')}")
                  print(f"   Response length: {len(response.text)} characters")
                  
                  if response.status_code == 200:
                      # Try to parse as JSON
                      try:
                          data = json.loads(response.text)
                          print(f"   ✓ JSON parsed successfully")
                          print(f"   JSON type: {type(data)}")
                          
                          # Save to file
                          filename = f"{structure}_response.json"
                          with open(filename, "w") as f:
                              json.dump(data, f, indent=2)
                          print(f"   Saved to {filename}")
                          
                          # Check structure
                          if isinstance(data, dict):
                              print(f"   Dict keys: {list(data.keys())}")
                              if "timeSeriesResponse" in data:
                                  print(f"   Found timeSeriesResponse!")
                          elif isinstance(data, list):
                              print(f"   List length: {len(data)}")
                              
                      except json.JSONDecodeError as e:
                          print(f"   ✗ JSON decode error: {e}")
                          print(f"   Response preview: {response.text[:200]}")
                          
                          # Save raw response
                          filename = f"{structure}_raw.txt"
                          with open(filename, "w") as f:
                              f.write(response.text)
                          print(f"   Saved raw response to {filename}")
                  else:
                      print(f"   ✗ HTTP Error: {response.status_code}")
                      print(f"   Error response: {response.text[:200]}")
                      
              except Exception as e:
                  print(f"   ✗ Exception: {e}")
              
              print("-" * 40)
          
          print("\\nDebug complete!")
          EOF
          
          python debug.py
      
      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: api-debug-results
          path: |
            *_response.json
            *_raw.txt
          retention-days: 7
